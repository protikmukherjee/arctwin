<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARC-Twin</title>
<style>
  :root{--bg:#f5f7f9;--card:#fff;--ink:#1a2532;--mut:#5c6b7a;--line:#dfe5eb;
        --acc:#0e6b5c;--accd:#0a5347;--accbg:#e9f3f0;--accln:#bcd9d2;
        --warn:#875800;--warnbg:#fdf4de;--warnln:#f0e1bd;
        --bad:#8e2f2f;--badbg:#fbeae8;--badln:#ebd0cc;--best:#e9f5f0;
        --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:9px 18px;background:var(--card);
         border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brand b{font-size:15.5px;letter-spacing:.01em}
  .brand span{font-size:11px;color:var(--mut)}
  header .meta{color:var(--mut);font-size:12px}
  .sp{flex:1}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
         border-radius:7px;padding:5px 11px;cursor:pointer;transition:border-color .12s,color .12s}
  button:hover{border-color:var(--acc);color:var(--acc)}
  button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button.primary:hover{background:var(--accd);border-color:var(--accd);color:#fff}
  button.tab.on{background:var(--accbg);border-color:var(--accln);color:var(--accd)}
  button.qh{width:24px;height:24px;padding:0;border-radius:50%;font-size:12.5px;font-weight:650;
            color:var(--mut);flex:none}
  button.qh:hover{color:var(--acc)}
  #app{display:flex;min-height:calc(100vh - 53px)}
  aside{width:284px;flex:none;border-right:1px solid var(--line);background:var(--card);padding:10px}
  aside h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:8px 6px 4px}
  .ci{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;
      border-radius:8px;padding:7px 10px;margin:2px 0;cursor:pointer}
  .ci:hover{background:var(--bg)}
  .ci.on{background:var(--accbg);border-color:var(--accln)}
  .ci .nm{font-weight:600;display:block}
  .ci .sub{color:var(--mut);font-size:12px}
  .tick{color:var(--acc);font-weight:700}
  .badge{display:inline-block;font-size:10.5px;font-weight:650;border-radius:99px;padding:1px 7px}
  .badge.gap{background:var(--badbg);color:var(--bad)}
  .badge.warn{background:var(--warnbg);color:var(--warn)}
  .badge.ok{background:var(--accbg);color:var(--accd)}
  main{flex:1;padding:16px 20px;max-width:1120px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 2px;font-size:16px;display:flex;align-items:center;gap:8px}
  .card h3{margin:14px 0 6px;font-size:13px}
  .mut{color:var(--mut)}
  .fn{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;
      padding:1px 9px;font-size:11.5px;margin:2px 4px 0 0}
  .note{background:var(--warnbg);border:1px solid var(--warnln);border-radius:8px;
        padding:8px 10px;margin-top:10px;font-size:12.5px}
  .gapcard{background:var(--badbg);border:1px solid var(--badln);border-radius:8px;padding:10px 12px;margin-top:10px}
  .okcard{background:var(--accbg);border:1px solid var(--accln);border-radius:8px;padding:10px 12px;margin-top:10px}
  .rolebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;
           background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  select,input.s{font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:var(--card)}
  select:focus-visible,input.s:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  input.s{width:220px}
  code{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--mut)}
  table{border-collapse:collapse;width:100%;margin-top:10px;font-variant-numeric:tabular-nums}
  th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);cursor:default}
  tbody tr:hover td,table tr:hover td{background:#fafbfc}
  tr.selrow:hover td,tr.selrow td{background:var(--accbg)}
  td:first-child,th:first-child{text-align:center;color:var(--mut);width:30px}
  td.nm,th.nm{text-align:left;white-space:normal}
  td.nm{font-weight:600}
  td.best{background:var(--best);font-weight:650}
  .just{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px}
  .just textarea{width:100%;min-height:52px;font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px}
  .row{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
  textarea.export{width:100%;min-height:140px;font:11.5px ui-monospace,Consolas,monospace;
                  border:1px solid var(--line);border-radius:8px;padding:8px;background:#fbfcfd}
  .tot{display:flex;gap:26px;margin:8px 0;font-size:14px;flex-wrap:wrap}
  .tot b{font-size:17px}
  .foot{color:var(--mut);font-size:11.5px;margin-top:14px;line-height:1.5}
  .rm{color:var(--bad);background:none;border:none;cursor:pointer;font-size:12px}
  details{margin-top:8px}
  summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:12.5px}
  details .body{color:var(--mut);margin-top:6px;font-size:12.5px;line-height:1.55}
  dl.gloss{margin:6px 0 0;font-size:12.5px}
  dl.gloss dt{font-weight:650;margin-top:7px}
  dl.gloss dd{margin:1px 0 0 0;color:var(--mut)}
  #drop{border:2px dashed #c9d3dc;border-radius:14px;padding:44px 20px;text-align:center;
        background:var(--card);cursor:pointer;transition:border-color .15s,background .15s}
  #drop.over,#drop:hover{border-color:var(--acc);background:var(--accbg)}
  #drop .big{font-size:17px;font-weight:650;margin-bottom:6px}
  ol.steps{margin:8px 0 0;padding-left:22px}
  ol.steps li{margin:6px 0}
  .land{max-width:840px;margin:26px auto;padding:0 18px}
  .banner{background:var(--warnbg);border:1px solid var(--warnln);border-radius:8px;
          padding:8px 12px;margin-bottom:12px;font-size:12.5px}
  /* help overlay */
  #hov{position:fixed;inset:0;background:rgba(15,23,32,.45);z-index:40;display:flex;
       align-items:flex-start;justify-content:center;padding:5vh 16px}
  #hov[hidden]{display:none}
  #hpanel{background:var(--card);border-radius:12px;max-width:760px;width:100%;
          max-height:88vh;overflow:auto;padding:20px 24px;box-shadow:0 8px 30px rgba(16,24,40,.25)}
  #hpanel h2{margin:0 0 4px;font-size:17px}
  #hpanel h3{margin:20px 0 6px;font-size:14px;padding-top:14px;border-top:1px solid var(--line)}
  #hpanel p,#hpanel li{font-size:13px;line-height:1.6;color:#2a3542}
  #hpanel .hclose{float:right}
  kbd{font:11.5px ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);
      border-bottom-width:2px;border-radius:5px;padding:1px 5px}
</style>
</head>
<body>
<header>
  <div class="brand"><b>ARC-Twin</b><span>Hardware selection for Capella physical architectures</span></div>
  <span class="meta" id="hm"></span><span class="sp"></span>
  <span id="tabs" style="display:none">
    <button id="bComp" class="tab">Components</button>
    <button id="bMap" class="tab">Role mapping</button>
    <button id="bAud" class="tab" style="display:none">Hardware audit</button>
    <button id="bRec" class="tab primary">Selection record <span id="sc"></span></button>
    <button id="bNew">Load another model</button>
  </span>
  <button id="bHelp">Help</button>
</header>
<div id="app"><aside id="side" style="display:none"></aside><main id="main"></main></div>
<input type="file" id="fi" accept=".capella" style="display:none">
<div id="hov" hidden><div id="hpanel"></div></div>
<script>
/* arctwin_core.js -- ARC-Twin model logic, shared between the browser app and the
   Node verification harness. Mirrors the reference implementation in selector/ and
   recommender/ (capella_pa.py, capella_la.py, classify.py, inject_parts.py,
   inject.py, match.py); functions keep the reference names in comments so the two
   implementations can be compared directly. No dependencies, no DOM. */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.ARC = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  /* ===================================================================== *
   *  Minimal XML tree parser.
   *
   *  A single parser serves both the browser and Node so the verification
   *  harness runs the same code as the app. Capella files need one
   *  accommodation: '<' and '&' are escaped in attribute values but '>' is
   *  left raw, so tag-end detection must be quote-aware. Only elements and
   *  attributes are read; attribute entity decoding matches ElementTree's.
   * ===================================================================== */

  function decodeEntities(s) {
    var NAMED = { amp: "&", lt: "<", gt: ">", quot: '"', apos: "'" };
    return String(s).replace(/&(#[0-9]+|#x[0-9a-fA-F]+|[A-Za-z]+);/g, function (m, body) {
      if (body.charAt(0) === "#") {
        var code = body.charAt(1) === "x" || body.charAt(1) === "X"
          ? parseInt(body.slice(2), 16) : parseInt(body.slice(1), 10);
        return isFinite(code) ? String.fromCodePoint(code) : m;
      }
      return Object.prototype.hasOwnProperty.call(NAMED, body) ? NAMED[body] : m;
    });
  }

  var WS = " \t\r\n";

  function parseXML(text) {
    var doc = { tag: "#doc", attrs: {}, children: [] };
    var stack = [doc];
    var i = 0, n = text.length;
    while (i < n) {
      var lt = text.indexOf("<", i);
      if (lt < 0) break;
      if (text.substr(lt, 2) === "<?") {
        i = text.indexOf("?>", lt);
        if (i < 0) throw new Error("unterminated processing instruction");
        i += 2; continue;
      }
      if (text.substr(lt, 4) === "<!--") {
        i = text.indexOf("-->", lt);
        if (i < 0) throw new Error("unterminated comment");
        i += 3; continue;
      }
      if (text.substr(lt, 9) === "<![CDATA[") {
        i = text.indexOf("]]>", lt);
        if (i < 0) throw new Error("unterminated CDATA");
        i += 3; continue;
      }
      if (text.substr(lt, 2) === "<!") {           // DOCTYPE etc.
        i = text.indexOf(">", lt) + 1;
        if (i === 0) throw new Error("unterminated declaration");
        continue;
      }
      if (text.charAt(lt + 1) === "/") {           // closing tag
        var gt = text.indexOf(">", lt);
        if (gt < 0) throw new Error("unterminated closing tag");
        var closing = text.slice(lt + 2, gt).trim();
        var top = stack.pop();
        if (!top || top.tag !== closing)
          throw new Error("mismatched closing tag </" + closing + "> (open was <" +
                          (top ? top.tag : "nothing") + ">)");
        i = gt + 1; continue;
      }
      // opening tag
      var j = lt + 1;
      while (j < n && WS.indexOf(text.charAt(j)) < 0 &&
             text.charAt(j) !== "/" && text.charAt(j) !== ">") j++;
      var el = { tag: text.slice(lt + 1, j), attrs: {}, children: [] };
      var selfClose = false;
      while (j < n) {
        while (j < n && WS.indexOf(text.charAt(j)) >= 0) j++;
        var c = text.charAt(j);
        if (c === ">") { j++; break; }
        if (c === "/") {
          if (text.charAt(j + 1) !== ">") throw new Error("bad tag end near index " + j);
          selfClose = true; j += 2; break;
        }
        var k = j;
        while (k < n && text.charAt(k) !== "=" && WS.indexOf(text.charAt(k)) < 0) k++;
        var name = text.slice(j, k);
        while (k < n && text.charAt(k) !== "=") k++;
        k++;
        while (k < n && WS.indexOf(text.charAt(k)) >= 0) k++;
        var q = text.charAt(k);
        if (q !== '"' && q !== "'") throw new Error("unquoted attribute value for " + name);
        var end = text.indexOf(q, k + 1);
        if (end < 0) throw new Error("unterminated attribute value for " + name);
        el.attrs[name] = decodeEntities(text.slice(k + 1, end));
        j = end + 1;
      }
      stack[stack.length - 1].children.push(el);
      if (!selfClose) stack.push(el);
      i = j;
    }
    if (stack.length !== 1) throw new Error("unclosed element <" + stack[stack.length - 1].tag + ">");
    for (var d = 0; d < doc.children.length; d++) return doc.children[d];
    throw new Error("no root element");
  }

  // Matches ElementTree's root.iter(): the element itself, then descendants, document order.
  function iterTree(el, fn) {
    fn(el);
    for (var i = 0; i < el.children.length; i++) iterTree(el.children[i], fn);
  }

  function asRoot(input) {
    if (typeof input === "string") return parseXML(input);
    return input;
  }

  /* ===================================================================== *
   *  capella_pa.py -- read the Physical Architecture
   * ===================================================================== */

  var XSI = "xsi:type";
  var T_PC = "pa:PhysicalComponent", T_PF = "pa:PhysicalFunction";
  var T_LC = "la:LogicalComponent", T_PART = "cs:Part";

  function xsiType(el) { return el.attrs[XSI] || ""; }

  // _index(root)
  function paIndex(root) {
    var fns = {}, lcs = {}, parts = {}, deployed = {}, links = {};
    iterTree(root, function (el) {
      var t = xsiType(el);
      if (endsWith(t, T_PF)) fns[el.attrs.id] = el.attrs.name || "";
      else if (endsWith(t, T_LC)) lcs[el.attrs.id] = el.attrs.name || "";
      else if (el.tag === "ownedFeatures" && endsWith(t, T_PART)) {
        parts[stripHash(el.attrs.abstractType || "")] = el.attrs.id;
        for (var i = 0; i < el.children.length; i++) {
          var d = el.children[i];
          if (d.tag === "ownedDeploymentLinks") {
            var dep = stripHash(d.attrs.deployedElement || "");
            deployed[dep] = true;
            (links[el.attrs.id] = links[el.attrs.id] || []).push(dep);
          }
        }
      }
    });
    return { fns: fns, lcs: lcs, parts: parts, deployed: deployed, links: links };
  }

  function endsWith(s, suf) { return s.length >= suf.length && s.slice(-suf.length) === suf; }
  function stripHash(s) { return s.replace(/^#+/, ""); }

  // capella_pa.read(path) -- input is model XML text or a parsed root
  function readPA(input) {
    var rootEl = asRoot(input);
    var ix = paIndex(rootEl);
    var out = [];
    iterTree(rootEl, function (el) {
      if (!endsWith(xsiType(el), T_PC)) return;
      var nature = el.attrs.nature;
      if (nature !== "BEHAVIOR" && nature !== "NODE") return;   // root Physical System
      var cid = el.attrs.id;
      var pid = ix.parts[cid];
      var allocated = [], realizes = null, kids = 0;
      for (var i = 0; i < el.children.length; i++) {
        var c = el.children[i];
        if (c.tag === "ownedFunctionalAllocation") {
          var fn = ix.fns[stripHash(c.attrs.targetElement || "")];
          if (fn) allocated.push(fn);
        } else if (c.tag === "ownedComponentRealizations") {
          realizes = ix.lcs[stripHash(c.attrs.targetElement || "")] || realizes;
        } else if (c.tag === "ownedPhysicalComponents") kids++;
      }
      out.push({
        name: el.attrs.name || "", id: cid, part_id: pid === undefined ? null : pid,
        nature: nature, functions: allocated, realizes: realizes,
        deployed: pid !== undefined && ix.deployed[pid] === true,
        n_children: kids,
        actor: (el.attrs.actor || "").toLowerCase() === "true",
        description: el.attrs.description || "",
        deploys: pid !== undefined ? (ix.links[pid] || []) : []
      });
    });
    return out;
  }

  function needsPart(c) { return c.nature === "BEHAVIOR" && !c.deployed; }

  // capella_pa.open_roles(path)
  function openRoles(input) { return readPA(input).filter(needsPart); }

  /* ===================================================================== *
   *  capella_la.py -- read the Logical Architecture
   * ===================================================================== */

  var T_LF = "la:LogicalFunction";
  var LA_CHILD = "ownedLogicalComponents", LA_ALLOC = "ownedFunctionalAllocation";

  function readLA(input) {
    var rootEl = asRoot(input);
    var fnames = {};
    iterTree(rootEl, function (el) {
      if (endsWith(xsiType(el), T_LF)) fnames[el.attrs.id] = el.attrs.name || "";
    });
    var out = [];
    (function walk(el, parent) {
      for (var i = 0; i < el.children.length; i++) {
        var child = el.children[i];
        if (child.tag !== LA_CHILD || !endsWith(xsiType(child), T_LC)) {
          walk(child, parent);
          continue;
        }
        var name = child.attrs.name || "";
        var kids = 0, fns = [];
        for (var j = 0; j < child.children.length; j++) {
          var a = child.children[j];
          if (a.tag === LA_CHILD) kids++;
          if (a.tag === LA_ALLOC) {
            var fid = stripHash(a.attrs.targetElement || "");
            if (fnames[fid]) fns.push(fnames[fid]);
          }
        }
        var role = (child.attrs.actor || "").toLowerCase() === "true" ? "actor"
                 : kids ? "container" : "leaf";
        out.push({ name: name, id: child.attrs.id, role: role,
                   functions: fns, n_children: kids, parent: parent });
        walk(child, name);
      }
    })(rootEl, null);
    return out;
  }

  function laLeaves(input) { return readLA(input).filter(function (c) { return c.role === "leaf"; }); }

  /* ===================================================================== *
   *  classify.py -- what KIND of thing is each component
   * ===================================================================== */

  var NAME_W = 3, FN_W = 1;

  function _norm(s) { return String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9 ]+/g, " "); }

  function _hits(text, kws) {
    var t = _norm(text), out = [];
    for (var i = 0; i < kws.length; i++) if (t.indexOf(_norm(kws[i])) >= 0) out.push(kws[i]);
    return out;
  }

  function _related(a, b, onto) {
    var by = {};
    for (var i = 0; i < onto.roles.length; i++) by[onto.roles[i].id] = onto.roles[i];
    return (by[a] && by[a].specialises === b) || (by[b] && by[b].specialises === a);
  }

  function classifyOne(comp, onto) {
    var name = comp.name, fns = comp.functions || [];
    var fntext = fns.join(" ; ");
    var scored = [];
    for (var i = 0; i < onto.roles.length; i++) {
      var role = onto.roles[i];
      var nh = _hits(name, role.name_kw || []);
      var fh = [];
      var kws = role.fn_kw || [];
      for (var k = 0; k < kws.length; k++)
        if (_norm(fntext).indexOf(_norm(kws[k])) >= 0 && fh.indexOf(kws[k]) < 0) fh.push(kws[k]);
      fh.sort();
      var s = NAME_W * nh.length + FN_W * fh.length;
      if (s) scored.push({ role: role, score: s, name_hits: nh, fn_hits: fh });
    }
    scored.sort(function (a, b) { return b.score - a.score; });   // stable sort; order must match the reference implementation

    // Specialisation promotion: unique matching specialisation carries its parent's score.
    var specByParent = {};
    scored.forEach(function (s2) {
      var sp = s2.role.specialises;
      if (sp) (specByParent[sp] = specByParent[sp] || []).push(s2);
    });
    var promotedParent = null;
    for (var p = 0; p < scored.length; p++) {
      var sp2 = scored[p].role.specialises;
      var parent = null;
      for (var q = 0; q < scored.length; q++)
        if (scored[q].role.id === sp2) { parent = scored[q]; break; }
      if (sp2 && parent !== null && (specByParent[sp2] || []).length === 1) {
        scored[p].score += parent.score;
        var moved = scored.splice(p, 1)[0];
        scored.unshift(moved);
        promotedParent = sp2;
        break;
      }
    }

    var minScore = onto.min_score !== undefined ? onto.min_score : 3;
    if (!scored.length || scored[0].score < minScore) {
      return { component: comp, role: null,
               score: scored.length ? scored[0].score : 0, verdict: "unclassified",
               runner_up: scored.length ? scored[0].role : null,
               name_role: null, fn_role: null, evidence: scored.slice(0, 2), conflict: false };
    }
    var best = scored[0];
    var runner = scored.length > 1 ? scored[1] : null;
    var nameRole = null, fnRole = null;
    for (var a = 0; a < scored.length; a++)
      if (scored[a].name_hits.length) { nameRole = scored[a].role.id; break; }
    for (var b2 = 0; b2 < scored.length; b2++)
      if (scored[b2].fn_hits.length) { fnRole = scored[b2].role.id; break; }
    var conflict = !!(nameRole && fnRole && nameRole !== fnRole && !_related(nameRole, fnRole, onto));

    var verdict = "classified";
    if (best.score < 3) verdict = "ambiguous";
    var parentIsRunner = !!(runner && promotedParent && runner.role.id === promotedParent);
    if (runner && !parentIsRunner && best.score - runner.score <= 1) verdict = "ambiguous";
    if (conflict) verdict = "ambiguous";

    return { component: comp, role: best.role, score: best.score, verdict: verdict,
             runner_up: runner ? runner.role : null, name_role: nameRole, fn_role: fnRole,
             evidence: scored.slice(0, 3), conflict: conflict };
  }

  function classifyAll(components, onto) {
    return components.map(function (c) { return classifyOne(c, onto); });
  }

  /* ===================================================================== *
   *  match.py -- Capella component <-> KSP catalog matching (IDF matcher)
   * ===================================================================== */

  var QUOTES = [["“", '"'], ["”", '"'], ["‘", "'"], ["’", "'"],
                ["«", '"'], ["»", '"']];

  // clean_name(s)
  function cleanName(s) {
    if (!s) return "";
    s = decodeEntities(decodeEntities(String(s)));       // &amp;#xA; appears double-escaped
    for (var i = 0; i < QUOTES.length; i++) s = s.split(QUOTES[i][0]).join(QUOTES[i][1]);
    // NOTE: the characters below are DATA (unicode signs normalised away), not punctuation.
    s = s.split("×").join("x").split("–").join("-").split("—").join("-");
    s = s.normalize("NFKC");
    s = s.replace(/[\r\n\t]+/g, " ");
    s = s.replace(/(?<=\d),(?=\d)/g, ".");               // 1,25 -> 1.25
    s = s.trim().replace(/_\d+$/, "");                   // Capella duplicate suffix
    return s.replace(/\s+/g, " ").trim();
  }

  var SPLIT_RE = /\s+\+\s+|\s+&\s+|\s*\+\s+|\s+\+\s*/;
  var QTY_RE = /^\s*(\d+)\s*[x*]\s*/i;

  function splitComposite(name) {
    name = cleanName(name);
    if (!name) return [];
    var pieces = name.split(SPLIT_RE).map(function (p) { return p.trim(); })
                     .filter(function (p) { return p; });
    if (!pieces.length) pieces = [name];
    var out = [];
    for (var i = 0; i < pieces.length; i++) {
      var p = pieces[i], qty = 1;
      var m = QTY_RE.exec(p);
      if (m) { qty = parseInt(m[1], 10); p = p.slice(m[0].length).trim(); }
      if (p) out.push([qty, p]);
    }
    return out;
  }

  var TOK_RE = /[a-z0-9][a-z0-9.\-]*/g;

  function tokens(s) {
    s = cleanName(s).toLowerCase();
    s = s.split("'").join("").split('"').join(" ");
    var out = [], m;
    TOK_RE.lastIndex = 0;
    while ((m = TOK_RE.exec(s)) !== null) {
      var t = m[0].replace(/^[.\-]+/, "").replace(/[.\-]+$/, "");
      if (t) out.push(t);
    }
    return out;
  }

  function isDesignator(t) {
    if (!/[0-9]/.test(t)) return false;
    if (/^\d+(\.\d+)?m?$/.test(t)) return false;        // 2, 1.25, 1.25m -> size, not code
    return /[a-z]/i.test(t) || t.indexOf("-") >= 0;
  }

  function designators(s) {
    var out = {};
    tokens(s).forEach(function (t) { if (isDesignator(t)) out[t] = true; });
    return out;
  }

  var SIZE_RE = /(\d+(?:\.\d+)?)\s*m\b|\((\d+(?:\.\d+)?)\s*m?\)/g;

  function sizes(s) {
    var out = {}, m;
    var t = cleanName(s).toLowerCase();
    SIZE_RE.lastIndex = 0;
    while ((m = SIZE_RE.exec(t)) !== null) {
      var v = parseFloat(m[1] !== undefined ? m[1] : m[2]);
      if (isFinite(v)) out[String(Math.round(v * 10000) / 10000)] = true;
    }
    return out;
  }

  var TYPE_RE = /\btype\s+([a-z])\b/gi;

  function typeLetters(s) {
    var out = {}, m;
    var t = cleanName(s);
    TYPE_RE.lastIndex = 0;
    while ((m = TYPE_RE.exec(t)) !== null) out[m[1].toLowerCase()] = true;
    return out;
  }

  var JUNK = ["flag", "kerbaleva", "edu ", "cabbage", "eggtnik", "drapeprojector", "potato"];

  function isJunkName(name) {
    var n = String(name == null ? "" : name).toLowerCase();
    return JUNK.some(function (j) { return n.indexOf(j) >= 0; });
  }

  function setOf(obj) { return Object.keys(obj); }
  function interCount(a, b) {
    var n = 0;
    for (var k in a) if (Object.prototype.hasOwnProperty.call(b, k)) n++;
    return n;
  }
  function sameKeys(a, b) {
    var ka = Object.keys(a).sort(), kb = Object.keys(b).sort();
    if (ka.length !== kb.length) return false;
    for (var i = 0; i < ka.length; i++) if (ka[i] !== kb[i]) return false;
    return true;
  }

  // class Catalog
  function Catalog(parts, dropJunk) {
    if (dropJunk === undefined) dropJunk = true;
    this.parts = parts.filter(function (p) { return !(dropJunk && isJunkName(p.name)); });
    var n = Math.max(this.parts.length, 1);
    var df = {};
    this._toks = new Map();
    for (var i = 0; i < this.parts.length; i++) {
      var ts = {};
      tokens(this.parts[i].name).forEach(function (t) { ts[t] = true; });
      this._toks.set(this.parts[i], ts);
      for (var t2 in ts) df[t2] = (df[t2] || 0) + 1;
    }
    this.w = {};
    var maxW = 0;
    for (var t3 in df) {
      this.w[t3] = Math.max(0, Math.log(n / (1.0 + df[t3])));
      if (this.w[t3] > maxW) maxW = this.w[t3];
    }
    this._max_w = maxW || 1.0;
  }
  Catalog.prototype.weight = function (t) {
    return Object.prototype.hasOwnProperty.call(this.w, t) ? this.w[t] : this._max_w;
  };
  Catalog.prototype.toks = function (p) {
    var ts = this._toks.get(p);
    if (ts) return ts;
    var out = {};
    tokens(p.name).forEach(function (t) { out[t] = true; });
    return out;
  };

  var ACCEPT = 0.55, NEAR = 0.40;

  function variantConflict(sub, cand) {
    var sSz = sizes(sub), cSz = sizes(cand.name);
    if (setOf(sSz).length && setOf(cSz).length && !interCount(sSz, cSz)) return true;
    var sTy = typeLetters(sub), cTy = typeLetters(cand.name);
    if (setOf(sTy).length && setOf(cTy).length && !interCount(sTy, cTy)) return true;
    return false;
  }

  var NUMTOK_RE = /^(\d+(?:\.\d+)?)m?$/;

  function contentTokens(ts, sizeVals) {
    var out = {};
    var hasSizes = setOf(sizeVals).length > 0;
    for (var t in ts) {
      if (t === "m") continue;
      if (hasSizes) {
        var m = NUMTOK_RE.exec(t);
        if (m) {
          var v = parseFloat(m[1]);
          if (isFinite(v) &&
              Object.prototype.hasOwnProperty.call(sizeVals, String(Math.round(v * 10000) / 10000)))
            continue;
        }
      }
      out[t] = true;
    }
    return out;
  }

  function coverage(subToks, candToks, cat, subSizes, candSizes) {
    var st = contentTokens(subToks, subSizes);
    var ct = contentTokens(candToks, candSizes);
    var tot = 0, hit = 0;
    for (var t in st) {
      var w = cat.weight(t);
      tot += w;
      if (Object.prototype.hasOwnProperty.call(ct, t)) hit += w;
    }
    if (tot <= 0) return 0.0;
    return hit / tot;
  }

  // match_one(sub, cat) -> [part|null, score, method, near|null]
  function matchOne(sub, cat) {
    sub = cleanName(sub);
    var st = {};
    tokens(sub).forEach(function (t) { st[t] = true; });
    if (!setOf(st).length) return [null, 0.0, "empty", null];
    var sDesig = {};
    for (var d in st) if (isDesignator(d)) sDesig[d] = true;
    var hasDesig = setOf(sDesig).length > 0;
    var sSz = sizes(sub);
    var normSub = setOf(st).sort().join(" ");

    var scored = [];
    for (var i = 0; i < cat.parts.length; i++) {
      var p = cat.parts[i];
      var ct = cat.toks(p);
      var cDesig = {};
      for (var d2 in ct) if (isDesignator(d2)) cDesig[d2] = true;

      if (setOf(ct).sort().join(" ") === normSub) return [p, 1.0, "exact", null];

      if (hasDesig && !interCount(sDesig, cDesig)) continue;
      if (variantConflict(sub, p)) continue;

      var cSz = sizes(p.name);
      var cov = coverage(st, ct, cat, sSz, cSz);
      var method;
      if (hasDesig && interCount(sDesig, cDesig)) {
        cov = Math.min(1.0, cov + 0.25);
        method = "designator";
      } else method = "idf";
      if (setOf(sSz).length && sameKeys(sSz, cSz)) cov = Math.min(1.0, cov + 0.10);
      scored.push([cov, method, p]);
    }

    if (!scored.length) {
      var near = nearDesignator(sDesig, cat);
      return [null, 0.0, "no-candidate", near];
    }
    scored.sort(function (a, b) {
      if (b[0] !== a[0]) return b[0] - a[0];
      return a[2].name < b[2].name ? -1 : a[2].name > b[2].name ? 1 : 0;
    });
    var covB = scored[0][0], methodB = scored[0][1], partB = scored[0][2];
    if (covB >= ACCEPT) return [partB, covB, methodB, null];
    return [null, covB, "below-threshold", covB >= NEAR ? partB : null];
  }

  function nearDesignator(sDesig, cat) {
    if (!setOf(sDesig).length) return null;
    var best = null, bd = 99;
    for (var i = 0; i < cat.parts.length; i++) {
      var p = cat.parts[i], ct = cat.toks(p);
      for (var c in ct) {
        if (!isDesignator(c)) continue;
        for (var s in sDesig) {
          var d = editDistance(s, c);
          if (d < bd && d <= 2) { best = p; bd = d; }
        }
      }
    }
    return best;
  }

  function editDistance(a, b) {
    if (a === b) return 0;
    if (Math.abs(a.length - b.length) > 2) return 99;
    var prev = [];
    for (var j = 0; j <= b.length; j++) prev.push(j);
    for (var i = 1; i <= a.length; i++) {
      var cur = [i];
      for (var j2 = 1; j2 <= b.length; j2++)
        cur.push(Math.min(prev[j2] + 1, cur[j2 - 1] + 1,
                          prev[j2 - 1] + (a.charAt(i - 1) !== b.charAt(j2 - 1) ? 1 : 0)));
      prev = cur;
    }
    return prev[prev.length - 1];
  }

  // match_component(name, cat) -> list of Match-shaped objects
  function matchComponent(name, cat) {
    var out = [];
    var subs = splitComposite(name);
    for (var i = 0; i < subs.length; i++) {
      var qty = subs[i][0], sub = subs[i][1];
      var r = matchOne(sub, cat);
      var note = "";
      if (r[0] === null && r[3] !== null) note = "closest: " + r[3].name;
      out.push({ component: name, sub: sub, qty: qty, part: r[0],
                 score: r[1], method: r[2], note: note, ok: r[0] !== null });
    }
    return out;
  }

  /* ===================================================================== *
   *  inject.py helpers: esc + quote-aware tag scanning
   * ===================================================================== */

  // esc(s): Capella's own attribute escaping ('<' and '&' escaped, '>' raw)
  function esc(s) {
    return String(s).split("&").join("&amp;").split("<").join("&lt;")
                    .split('"').join("&quot;").split("\n").join("&#xA;");
  }

  // _tag_end(text, lt)
  function tagEnd(text, lt) {
    var i = lt + 1, inQuote = false;
    while (i < text.length) {
      var c = text.charAt(i);
      if (c === '"') inQuote = !inQuote;
      else if (c === ">" && !inQuote)
        return [i + 1, text.charAt(i - 1) === "/"];
      i++;
    }
    throw new Error("unterminated tag");
  }

  var PC_TAG = "ownedPhysicalComponents";

  // _iter_tags(text, name) -> array of [lt, end, selfClosing, isClose]
  function iterTags(text, name) {
    var out = [], i = 0;
    var openLit = "<" + name, closeLit = "</" + name + ">";
    for (;;) {
      var a = text.indexOf(openLit, i);
      var b = text.indexOf(closeLit, i);
      if (a === -1 && b === -1) return out;
      if (a !== -1 && (b === -1 || a < b)) {
        var nxt = text.charAt(a + openLit.length);
        if (nxt !== " " && nxt !== "\t" && nxt !== "\n" && nxt !== ">" && nxt !== "/") {
          i = a + 1;
          continue;
        }
        var te = tagEnd(text, a);
        out.push([a, te[0], te[1], false]);
        i = te[0];
      } else {
        out.push([b, b + closeLit.length, false, true]);
        i = b + closeLit.length;
      }
    }
  }

  // _element_span(text, start)
  function elementSpan(text, start) {
    var depth = 0;
    var tags = iterTags(text, PC_TAG);
    for (var i = 0; i < tags.length; i++) {
      var lt = tags[i][0], end = tags[i][1], selfclose = tags[i][2], isClose = tags[i][3];
      if (lt < start) continue;
      if (isClose) {
        depth -= 1;
        if (depth === 0) return [start, end];
      } else if (!selfclose) depth += 1;
      else if (lt === start) return [start, end];
    }
    return null;
  }

  /* ===================================================================== *
   *  inject_parts.py -- write the chosen parts into the model
   * ===================================================================== */

  var INJ_PC = "org.polarsys.capella.core.data.pa:PhysicalComponent";
  var INJ_PART = "org.polarsys.capella.core.data.cs:Part";
  var INJ_DEPLOY = "org.polarsys.capella.core.data.pa.deployment:PartDeploymentLink";
  var DEPLOY_PREFIX = "org.polarsys.capella.core.data.pa.deployment";
  var MARK = "[ARC-Twin]";

  function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  function declaredPrefixes(text) {
    var start = text.indexOf("<org.polarsys");
    if (start < 0) throw new Error("not a Capella model: no org.polarsys root element");
    var rootTag = text.slice(start, text.indexOf(">", start));
    var out = {}, m;
    var re = /xmlns:([\w.]+)=/g;
    while ((m = re.exec(rootTag)) !== null) out[m[1]] = true;
    return out;
  }

  // ensure_namespace(text, prefix). Required: a model that never contained a deployment
  // link does not declare the deployment namespace, and writing an xsi:type that uses an
  // undeclared prefix produces well-formed XML that EMF cannot load. Generic XML parsers
  // do not detect this, so it is declared here and checked in checkPrefixes.

  function ensureNamespace(text, prefix) {
    if (declaredPrefixes(text)[prefix]) return text;
    var m = /xmlns:org\.polarsys\.capella\.core\.data\.pa="([^"]+)"/.exec(text);
    if (!m) throw new Error("cannot derive the deployment namespace: the model does not " +
                            "declare the 'pa' namespace");
    var uri = m[1].replace("/pa/", "/pa/deployment/");
    var end = text.indexOf(">", text.indexOf("<org.polarsys"));
    return text.slice(0, end) + '\n    xmlns:' + prefix + '="' + uri + '"' + text.slice(end);
  }

  function checkPrefixes(text) {
    var declared = declaredPrefixes(text);
    declared.xsi = true; declared.xmi = true;
    var used = {}, m;
    var re = /xsi:type="([^"]+)"/g;
    while ((m = re.exec(text)) !== null)
      if (m[1].indexOf(":") >= 0) used[m[1].split(":")[0]] = true;
    var missing = Object.keys(used).filter(function (u) { return !declared[u]; }).sort();
    if (missing.length)
      throw new Error("undeclared namespace prefix(es) in xsi:type: " + missing.join(", "));
  }

  function physicalSystemInsertPos(text) {
    var re = new RegExp('<ownedPhysicalComponents\\s+xsi:type="' + escRe(INJ_PC) + '"[^>]*?>', "gs");
    var m;
    while ((m = re.exec(text)) !== null) {
      var tag = m[0];
      if (/\/>\s*$/.test(tag) || tag.indexOf('nature="NODE"') >= 0 ||
          tag.indexOf('nature="BEHAVIOR"') >= 0) continue;
      return m.index + tag.length;
    }
    return null;
  }

  // strip_previous(text)
  function stripPrevious(text) {
    var ids = [], m;
    var re = /<ownedPhysicalComponents\b[^>]*?>/gs;
    while ((m = re.exec(text)) !== null) {
      if (m[0].indexOf(MARK) >= 0 && m[0].indexOf('nature="NODE"') >= 0) {
        var i = /\bid="([^"]*)"/.exec(m[0]);
        if (i) ids.push(i[1]);
      }
    }
    for (var k = 0; k < ids.length; k++) {
      var reF = new RegExp('\\s*<ownedFeatures\\b[^>]*?abstractType="#' + escRe(ids[k]) +
                           '"[^>]*?(?:/>|>.*?</ownedFeatures>)', "gs");
      text = text.replace(reF, "");
    }
    for (;;) {
      var mm = new RegExp("<ownedPhysicalComponents\\b[^>]*?" + escRe(MARK), "s").exec(text);
      if (!mm) return text;
      var start = text.lastIndexOf("<ownedPhysicalComponents", mm.index + 30);
      var span = elementSpan(text, start);
      if (span === null) return text;
      var a = span[0], b = span[1];
      while (a > 0 && (text.charAt(a - 1) === " " || text.charAt(a - 1) === "\t")) a--;
      if (a > 0 && text.charAt(a - 1) === "\n") a--;
      text = text.slice(0, a) + text.slice(b);
    }
  }

  function hasPreviousRun(text) {
    var re = /<ownedPhysicalComponents\b[^>]*?>/gs, m;
    while ((m = re.exec(text)) !== null)
      if (m[0].indexOf(MARK) >= 0 && m[0].indexOf('nature="NODE"') >= 0) return true;
    return false;
  }

  // describe(sel)
  function describeSel(sel) {
    var d = MARK + " Catalogue part selected against the model's requirements.";
    if (sel.satisfies && sel.satisfies.length) d += " Satisfies: " + sel.satisfies.join(", ") + ".";
    if (sel.container) d += " Vessel: " + sel.container + ".";
    if (sel.surrogate) d += " SURROGATE: no catalogue part can realise this role; this one " +
                            "stands in and the component is notional.";
    if (sel.justification) d += " Justification: " + sel.justification;
    return d;
  }

  // Inverse of describeSel(): recovers a previous ARC-Twin run's selections from the
  // model so a revision session starts from the recorded choices.
  function recoverSelections(input) {
    var comps = readPA(input);
    var byPart = {};
    comps.forEach(function (c) { if (c.part_id) byPart[c.part_id] = c; });
    var out = [];
    comps.forEach(function (c) {
      if (c.nature !== "NODE" || (c.description || "").indexOf(MARK) !== 0) return;
      var target = null;
      (c.deploys || []).forEach(function (pid) {
        if (byPart[pid]) target = byPart[pid].name;
      });
      var d = c.description;
      var sat = /Satisfies: ([^.]*)\./.exec(d);
      var ves = /Vessel: ([^.]*)\./.exec(d);
      var jus = /Justification: ([\s\S]*)$/.exec(d);
      out.push({ target: target, part: c.name,
                 satisfies: sat ? sat[1].split(/,\s*/).filter(Boolean) : [],
                 container: ves ? ves[1] : "",
                 surrogate: d.indexOf("SURROGATE:") >= 0,
                 justification: jus ? jus[1] : "" });
    });
    return out;
  }

  function defaultUuid() {
    if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
    // last-resort v4 (old browsers only)
    var b = [];
    for (var i = 0; i < 16; i++) b.push(Math.floor(Math.random() * 256));
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    var h = b.map(function (x) { return (x + 256).toString(16).slice(1); }).join("");
    return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" +
           h.slice(16, 20) + "-" + h.slice(20);
  }

  // main() of inject_parts.py, as a pure function.
  // selections: [{target|logical_component, part, satisfies[], container, justification,
  //               surrogate}]; uuidFn optional (tests pass a deterministic one).
  function inject(modelText, selections, uuidFn) {
    uuidFn = uuidFn || defaultUuid;
    if (!selections || !selections.length) throw new Error("no selections to inject");

    // Strip a previous run FIRST, then read targets from the stripped model.
    var text = stripPrevious(modelText);

    var targets = {}, taken = {};
    readPA(text).forEach(function (c) {
      if (c.nature === "BEHAVIOR" && c.part_id)
        (c.deployed ? taken : targets)[c.name] = c.part_id;
    });
    var pos = physicalSystemInsertPos(text);
    if (pos === null)
      throw new Error("Could not find the root Physical System component. Has the " +
                      "LC / LA to PC / PA transition been run?");

    var comps = "", parts = "", problems = [], n = 0;
    for (var i = 0; i < selections.length; i++) {
      var s = selections[i];
      var target = s.target || s.logical_component || "";
      var partOfTarget = targets[target];
      if (!partOfTarget) {
        var why = Object.prototype.hasOwnProperty.call(taken, target)
          ? "already has a part deployed onto it"
          : "no BEHAVIOR component of that name in the Physical Architecture";
        problems.push({ part: s.part, target: target, why: why });
        continue;
      }
      var cid = uuidFn(), pid = uuidFn();
      comps += '\n          <ownedPhysicalComponents xsi:type="' + INJ_PC + '" id="' + cid +
               '" name="' + esc(s.part) + '" nature="NODE" description="' +
               esc(describeSel(s)) + '"/>';
      parts += '\n          <ownedFeatures xsi:type="' + INJ_PART + '" id="' + pid +
               '" name="' + esc(s.part) + '" abstractType="#' + cid + '">' +
               '\n            <ownedDeploymentLinks xsi:type="' + INJ_DEPLOY + '" id="' +
               uuidFn() + '" deployedElement="#' + partOfTarget + '" location="#' + pid + '"/>' +
               '\n          </ownedFeatures>';
      n += 1;
    }

    var out = text.slice(0, pos) + parts + comps + text.slice(pos);
    if (n) out = ensureNamespace(out, DEPLOY_PREFIX);
    parseXML(out);          // well-formedness ...
    checkPrefixes(out);     // ... which is NOT enough on its own, see ensureNamespace
    return { text: out, placed: n, problems: problems };
  }

  /* ===================================================================== *
   *  Regression suite mirroring match.py _self_test()
   * ===================================================================== */

  function matchSelfTest(kbParts) {
    var fails = [], log = [];
    function check(label, got, exp) {
      var g = JSON.stringify(got), e = JSON.stringify(exp);
      var ok = g === e;
      if (!ok) fails.push(label);
      log.push((ok ? "[ok ] " : "[FAIL] ") + label + ": got=" + g + " exp=" + e);
    }
    check("strip XML newline entity",
          cleanName("HG-5 High Gain Antenna&#xA;"), "HG-5 High Gain Antenna");
    check("strip Capella copy suffix", cleanName("TD-12 Decoupler_2"), "TD-12 Decoupler");
    check("curly quotes normalized",
          cleanName("LV-909 “Terrier”"), 'LV-909 "Terrier"');
    check("european decimal comma", setOf(sizes("shell (1,25)")), ["1.25"]);
    check("unicode multiplication sign",
          splitComposite("2 × OX-4W 3×2 Photovoltaic"), [[2, "OX-4W 3x2 Photovoltaic"]]);
    check("composite split",
          splitComposite("RV-1x + FL-R20 Fuel Tank  + Small Inline Reaction Wheel")
            .map(function (x) { return x[1]; }),
          ["RV-1x", "FL-R20 Fuel Tank", "Small Inline Reaction Wheel"]);
    check("designator detected", setOf(designators("FL-T800 Fuel Tank")), ["fl-t800"]);
    check("bare size is not a designator", setOf(designators("Heat Shield 1.25 m")), []);
    check("type letter", setOf(typeLetters("Structural Wing Type B")), ["b"]);

    if (kbParts && kbParts.length) {
      var cat = new Catalog(kbParts);
      function best(name) {
        var ms = matchComponent(name, cat);
        return ms.length && ms[0].ok ? ms[0].part.name : null;
      }

 *  Loading and analysing a model
 * ------------------------------------------------------------------ */

function analyze(text, fileName){
  if(text.indexOf('<viewpoint:DAnalysis')>=0 || /\.aird$/i.test(fileName))
    throw new Error('This is the .aird file, which holds the diagrams. Please load the '+
      '.capella file from the same project folder; that file holds the model itself.');
  var root=ARC.parseXML(text);
  if(text.indexOf('org.polarsys')<0)
    throw new Error('This does not appear to be a Capella model: no Capella metamodel '+
      'elements were found in the file.');
  var prevRun=ARC.hasPreviousRun(text);
  var work=prevRun?ARC.stripPrevious(text):text;
  var paAll=ARC.readPA(prevRun?work:root);
  var open=paAll.filter(ARC.needsPart);
  var name=fileName.replace(/\.capella$/i,'');
  var s={fileName:fileName,name:name,original:text,work:work,prevRun:prevRun,
         key:'arctwin2-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-'),
         comps:[],audit:[],laPreview:[],mode:null,layer:'physical'};

  // hardware audit rows: the model's own NODE leaf components, actors excluded
  var byPart={}; paAll.forEach(function(c){if(c.part_id)byPart[c.part_id]=c;});
  paAll.forEach(function(c){
    if(c.nature!=='NODE'||c.n_children||c.actor)return;
    var hosts=(c.deploys||[]).map(function(pid){return byPart[pid]?byPart[pid].name:null;})
      .filter(Boolean);
    var ms=ARC.matchComponent(c.name,MCAT);
    s.audit.push({name:c.name,hosts:hosts,injected:(c.description||'').indexOf(ARC.MARK)===0,
                  matches:ms});
  });

  if(!paAll.length){
    var leaves=ARC.laLeaves(root);
    if(!leaves.length)
      throw new Error('No Logical or Physical Architecture was found in this model. Build '+
        'the Logical Architecture first, run the LC / LA to PC / PA transition in Capella, '+
        'then load the file again.');
    s.mode='guide';s.layer='logical';
    s.laPreview=ARC.classifyAll(leaves,ONTO);
    return s;
  }
  var results=ARC.classifyAll(open,ONTO);
  s.comps=results.map(function(r,i){return{
    id:'c'+i,name:r.component.name,functions:r.component.functions,
    role:r.role?r.role.id:null,verdict:r.verdict,score:r.score,
    runner_up:r.runner_up?r.runner_up.id:null,
    conflict:r.conflict?{name_role:r.name_role,fn_role:r.fn_role}:null,
    evidence:r.evidence.map(function(e){return{id:e.role.id,score:e.score,
      name_hits:e.name_hits,fn_hits:e.fn_hits};})};});
  s.mode=open.length?'select':'audit';
  return s;
}

function freshState(){return{sel:{},ovr:{},obj:{},flt:{},mcost:null,mmass:null,
  view:'comp',cid:null,q:'',pending:null};}

function boot(text,fileName){
  var s;
  try{s=analyze(text,fileName);}
  catch(e){renderError(fileName,e.message||String(e));return;}
  S=s;
  var saved=null;
  try{var raw=localStorage.getItem(S.key);if(raw)saved=JSON.parse(raw);}catch(e){}
  state=freshState();
  if(saved&&saved.sel){state.sel=saved.sel;state.ovr=saved.ovr||{};state.obj=saved.obj||{};
    state.flt=saved.flt||{};
    state.mcost=typeof saved.mcost==='number'?saved.mcost:null;
    state.mmass=typeof saved.mmass==='number'?saved.mmass:null;}
  else if(S.prevRun){
    // no working copy in this browser: recover the previous run so it can be revised
    var rec=ARC.recoverSelections(S.original);
    rec.forEach(function(r){
      var c=null;
      for(var i=0;i<S.comps.length;i++)if(S.comps[i].name===r.target){c=S.comps[i];break;}
      if(!c)return;
      var p=KBBY[r.part]||{};
      (state.sel[c.id]=state.sel[c.id]||[]).push({part:r.part,cost:p.cost,mass:p.dry_mass_t,
        container:r.container||'Vessel 1',satisfies:(r.satisfies||[]).join(', '),
        justification:r.justification||'',surrogate:!!r.surrogate,role:c.role});
    });
  }
  if(S.mode==='guide')state.view='guide';
  else if(S.mode==='audit')state.view='audit';
  else state.cid=S.comps.length?S.comps[0].id:null;
  save();render();
}

function save(){if(!S)return;
  try{localStorage.setItem(S.key,JSON.stringify({sel:state.sel,ovr:state.ovr,obj:state.obj,
    flt:state.flt,mcost:state.mcost,mmass:state.mmass}));}
  catch(e){}}

function roleOf(c){var id=state.ovr[c.id]!==undefined?state.ovr[c.id]:c.role;return id?BY[id]:null;}
function selsOf(cid){return state.sel[cid]||[];}
function nSel(){var n=0;for(var k in state.sel)n+=state.sel[k].length;return n;}

function query(role){
  if(!role)return {none:true,list:[],notes:[]};
  var q=role.query||{};
  if(q.category&&!CATS[q.category.toLowerCase()])return {gap:true,cat:q.category,list:[],notes:[]};
  var out=KB.filter(function(p){return !p.junk&&!p.jet;}),notes=[];
  if(q.category){var c=q.category.toLowerCase();
    out=out.filter(function(p){return (p.category||'').toLowerCase()===c;});}
  if(q.name_contains){var s=q.name_contains.toLowerCase();
    out=out.filter(function(p){return p.name.toLowerCase().indexOf(s)>=0;});}
  Object.keys(q).forEach(function(k){
    if(k.indexOf('min_')!==0&&k.indexOf('max_')!==0)return;
    var f=k.slice(4),v=q[k];
    var bad=out.filter(function(p){return p[f]!=null&&typeof p[f]!=='number';});
    if(bad.length)notes.push(bad.length+' candidate(s) have a non-numeric ‘'+f+
      '’ value in the catalogue and could not be tested against this constraint (e.g. '+
      bad[0].name+')');
    out=out.filter(function(p){return typeof p[f]==='number'&&
      (k.indexOf('min_')===0?p[f]>=v:p[f]<=v);});
  });
  return {list:out,notes:notes};
}
var OBJS=[['cost','Cost (low first)',1],['dry_mass_t','Dry mass (low first)',1],
 ['isp_vac_s','Isp, vacuum (high first)',-1],['twr_vac','TWR (high first)',-1],
 ['thrust_vac_kN','Thrust, vacuum (high first)',-1],['ec_capacity','EC capacity (high first)',-1],
 ['ec_rate','EC rate (high first)',-1]];
function colsFor(role){
  var c=((role&&role.query||{}).category||'').toLowerCase();
  var cols=[['cost','Cost'],['dry_mass_t','Mass t']];
  if(c==='engine')cols=cols.concat([['thrust_vac_kN','Thr kN'],['isp_vac_s','Isp'],['twr_vac','TWR']]);
  if(c==='electrical')cols=cols.concat([['ec_capacity','EC cap'],['ec_rate','EC/s']]);
  return cols;
}
function sortBy(l,k,d){return l.slice().sort(function(a,b){
  var x=a[k],y=b[k],nx=typeof x!=='number',ny=typeof y!=='number';
  if(nx&&ny)return 0;if(nx)return 1;if(ny)return -1;return (x-y)*d;});}

/* Constraints. Cost and mass are upper limits; performance figures are lower limits.
   A part with no published value for a constrained figure is excluded while that
   constraint is set. */
var FDIR={cost:'max',dry_mass_t:'max',thrust_vac_kN:'min',isp_vac_s:'min',twr_vac:'min',
  ec_capacity:'min',ec_rate:'min'};
function applyFilters(list,cid){
  var f=state.flt[cid]||{};
  return list.filter(function(p){
    for(var k in f){
      var v=f[k];
      if(typeof v!=='number')continue;
      var x=p[k];
      if(typeof x!=='number')return false;
      if(FDIR[k]==='max'){if(x>v)return false;}else{if(x<v)return false;}
    }
    return true;});
}
function totals(){
  var tc=0,tm=0;
  S.comps.forEach(function(c){selsOf(c.id).forEach(function(x){
    if(typeof x.cost==='number')tc+=x.cost;
    if(typeof x.mass==='number')tm+=x.mass;});});
  return {cost:tc,mass:Math.round(tm*1000)/1000};
}
function limitChips(t){
  var h='';
  if(state.mcost!=null)h+=t.cost<=state.mcost
    ?' <span class="badge ok">cost '+fmt(t.cost)+' of '+fmt(state.mcost)+'</span>'
    :' <span class="badge gap">cost over by '+fmt(t.cost-state.mcost)+'</span>';
  if(state.mmass!=null)h+=t.mass<=state.mmass
    ?' <span class="badge ok">mass '+fmt(t.mass)+' of '+fmt(state.mmass)+' t</span>'
    :' <span class="badge gap">mass over by '+fmt(Math.round((t.mass-state.mmass)*1000)/1000)+' t</span>';
  return h;
}

function sanity(p,roleId){
  var w=[];
  if(p&&p.jet)w.push('This is an air-breathing jet engine. It cannot operate in vacuum.');
  if(roleId==='power-storage')w.push('EC capacity is an amount, not a rate. Check it '+
    'against the requirement: continuous load (EC/s) × longest dark period (s) must fit '+
    'within the capacity.');
  if(roleId==='power-generation')w.push('The EC/s rating assumes full sunlight at Kerbin’s '+
    'distance. Scale it for the target body, and remember that storage must cover the night.');
  if(roleId==='propulsion'&&p&&typeof p.isp_vac_s==='number'&&p.isp_vac_s>=700)
    w.push('Engines with very high Isp trade away thrust and restrict fuel choice (the '+
    'LV-N uses LiquidFuel only; ion engines need Xenon and power). Verify the TWR at the '+
    'target body and pick a matching tank.');
  if(roleId==='propulsion'&&p&&typeof p.thrust_vac_kN==='number'&&p.thrust_vac_kN<25)
    w.push('Thrust is below 25 kN: adequate for probes, marginal for landers. '+
    'TWR = thrust / (mass × local g) must exceed 1 to land or lift off.');
  return w;
}

function evidenceLine(c){
  if(!c.evidence||!c.evidence.length)return'no keyword matched';
  return c.evidence.map(function(e){
    var bits=[];
    if(e.name_hits&&e.name_hits.length)bits.push('name: '+e.name_hits.join(', '));
    if(e.fn_hits&&e.fn_hits.length)bits.push('functions: '+e.fn_hits.join(', '));
    return esc(BY[e.id]?BY[e.id].label:e.id)+' ('+e.score+'), '+esc(bits.join(' · '));
  }).join('<br>');
}

function prevRunBanner(){

  if(r)h+='<div style="margin-top:8px"><span class="mut" style="font-size:12px">Catalogue '+

  if(!r){
    h+='<div class="card"><div class="gapcard"><b>No catalogue role fits this component.</b> '+

      'which is itself a documented engineering finding.</div>'+searchTable(c)+'</div>';
  }else if(q.gap){

  }else{
    var key=state.obj[c.id]||r.rank||'cost';

    if(!objs.some(function(o){return o[0]===key;}))key=(objs[0]||OBJS[0])[0];

      'A single weighted score would hide the trade-off between objectives behind invented '+
      'weights. Instead, rank by one objective at a time; the best value in each column is '+
      'highlighted, so a conflict between objectives stays visible and the final choice, '+
      'with its reasoning, remains yours.</div></details></div>';
  }
  h+=pendingCard(c)+selCard(c);
  document.getElementById('main').innerHTML=h;
  wire(c);
  wireHelpButtons();
}
function constraint(r){var q=r.query||{},b=[];
  if(q.category)b.push('category = '+q.category);
  if(q.name_contains)b.push('name contains “'+q.name_contains+'”');
  Object.keys(q).forEach(function(k){if(k.indexOf('min_')===0)b.push(k.slice(4)+' ≥ '+q[k]);
    if(k.indexOf('max_')===0)b.push(k.slice(4)+' ≤ '+q[k]);});
  return b.join(' · ')||'no constraints';}
function searchTable(c){
  var pool=KB.filter(function(p){return !p.junk&&!p.jet;});
  if(state.q){var s=state.q.toLowerCase();
    pool=pool.filter(function(p){return p.name.toLowerCase().indexOf(s)>=0;});}
  return '<div class="row" style="margin-top:10px"><input class="s" id="sq" placeholder="search all '+
    pool.length+' parts…" value="'+esc(state.q)+'"></div>'+
    table(sortBy(pool,'cost',1).slice(0,12),[['cost','Cost'],['dry_mass_t','Mass t']],c);
}
function table(list,cols,c){
  var best={};
  cols.forEach(function(col){
    var vs=list.map(function(p){return p[col[0]];}).filter(function(v){return typeof v==='number';});
    if(vs.length)best[col[0]]=(col[0]==='cost'||col[0]==='dry_mass_t')?
      Math.min.apply(null,vs):Math.max.apply(null,vs);});
  var h='<table><tr><th>#</th><th class="nm">Part</th>';
  cols.forEach(function(col){h+='<th title="'+esc(colTitle(col[0]))+'">'+col[1]+'</th>';});
  h+='<th></th></tr>';
  list.forEach(function(p,i){
    var on=selsOf(c.id).some(function(s){return s.part===p.name;});
    h+='<tr'+(on?' class="selrow"':'')+'><td>'+(i+1)+'</td><td class="nm">'+esc(p.name)+'</td>';
    cols.forEach(function(col){var v=p[col[0]];
      h+='<td'+(typeof v==='number'&&v===best[col[0]]?' class="best"':'')+'>'+fmt(v)+'</td>';});
    h+='<td><button data-pk="'+esc(p.name)+'">'+(on?'Add again':'Choose')+'</button></td></tr>';});
  return h+'</table>';
}
function pendingCard(c){
  if(!state.pending)return'';
  var r=roleOf(c);
  var warns=sanity(KBBY[state.pending],r?r.id:null);
  var pp=KBBY[state.pending];
  if(pp&&(state.mcost!=null||state.mmass!=null)){
    var t=totals();
    if(state.mcost!=null&&typeof pp.cost==='number'&&t.cost+pp.cost>state.mcost)
      warns.push('Adding this part brings the total cost to '+fmt(t.cost+pp.cost)+
        ', above the mission limit of '+fmt(state.mcost)+'.');
    if(state.mmass!=null&&typeof pp.dry_mass_t==='number'&&t.mass+pp.dry_mass_t>state.mmass)
      warns.push('Adding this part brings the total dry mass to '+
        fmt(Math.round((t.mass+pp.dry_mass_t)*1000)/1000)+
        ' t, above the mission limit of '+fmt(state.mmass)+' t.');
  }
  return '<div class="card just" id="pd"><b>Selected:</b> '+esc(state.pending)+
    warns.map(function(w){return '<div class="note">⚠ '+esc(w)+'</div>';}).join('')+
    '<br><textarea id="pt" placeholder="Justification: which requirement does this part '+
    'satisfy, and which objective decided the choice?"></textarea>'+
    '<div class="row"><label>Vessel / assembly: <input class="s" id="pc" list="vs" value="Vessel 1"></label>'+
    '<datalist id="vs"><option>Vessel 1</option><option>Lander</option>'+
    '<option>Relay Satellite</option><option>Launch Stage</option><option>Orbiter</option></datalist>'+
    '<label>Satisfies <input class="s" id="pr" placeholder="e.g. FR3, NFR1 (optional)" '+
    'style="width:150px"></label>'+
    '<button class="primary" id="pok">Confirm</button><button id="pno">Cancel</button>'+
    '<span class="mut" id="pe"></span></div></div>';
}
function selCard(c){
  var s=selsOf(c.id);if(!s.length)return'';
  var h='<div class="card"><h3 style="margin-top:0">Selected for this component</h3>';
  s.forEach(function(x,i){h+='<div style="margin:6px 0"><b>'+esc(x.part)+'</b>, '+esc(x.container)+
    (x.surrogate?' <span class="badge gap">stand-in</span>':'')+
    (x.satisfies?' <span class="fn">'+esc(x.satisfies)+'</span>':'')+
    ' <button class="rm" data-rm="'+c.id+':'+i+'">remove</button>'+
    '<div class="mut">'+esc(x.justification)+'</div></div>';});
  return h+'</div>';
}
function wire(c){
  var rl=document.getElementById('rl');
  if(rl)rl.onchange=function(){state.ovr[c.id]=rl.value;save();render();};
  var rst=document.getElementById('rst');
  if(rst)rst.onclick=function(){delete state.ovr[c.id];save();render();};
  var ob=document.getElementById('ob');
  if(ob)ob.onchange=function(){state.obj[c.id]=ob.value;save();render();};
  var sq=document.getElementById('sq');
  if(sq)sq.oninput=function(){state.q=sq.value;render();
    var e=document.getElementById('sq');e.focus();e.setSelectionRange(e.value.length,e.value.length);};
  [].forEach.call(document.querySelectorAll('[data-cf]'),function(inp){
    inp.onchange=function(){
      var k=inp.getAttribute('data-cf');
      var f=state.flt[c.id]=(state.flt[c.id]||{});
      var v=parseFloat(inp.value);
      if(isFinite(v))f[k]=v;else delete f[k];
      if(!Object.keys(f).length)delete state.flt[c.id];
      save();render();};});
  var cclr=document.getElementById('cclr');
  if(cclr)cclr.onclick=function(){delete state.flt[c.id];save();render();};
  [].forEach.call(document.querySelectorAll('[data-pk]'),function(b){b.onclick=function(){
    state.pending=b.getAttribute('data-pk');render();
    var t=document.getElementById('pt');if(t)t.focus();};});
  if(state.pending){
    document.getElementById('pok').onclick=function(){
      var t=document.getElementById('pt').value.replace(/^\s+|\s+$/g,'');
      if(t.length<15){document.getElementById('pe').textContent=
        'Please enter a justification of at least 15 characters.';return;}
      var p=KBBY[state.pending];
      var r=roleOf(c),q=r?query(r):{gap:true};
      if(!state.sel[c.id])state.sel[c.id]=[];
      state.sel[c.id].push({part:p.name,cost:p.cost,mass:p.dry_mass_t,
        container:document.getElementById('pc').value||'Vessel 1',
        satisfies:document.getElementById('pr').value||'',
        justification:t,surrogate:!!(q.gap||!r),role:r?r.id:null});
      state.pending=null;save();render();};
    document.getElementById('pno').onclick=function(){state.pending=null;render();};
  }
  [].forEach.call(document.querySelectorAll('[data-rm]'),function(b){b.onclick=function(){
    var a=b.getAttribute('data-rm').split(':');state.sel[a[0]].splice(parseInt(a[1],10),1);

}

      '<th class="nm" title="exact: identical name · designator: part code agreement · '+

function buildSelections(){
  var out=[];
  S.comps.forEach(function(c){selsOf(c.id).forEach(function(s){
    out.push({target:c.name,logical_component:c.name,role:s.role,part:s.part,
      container:s.container,qty:1,
      satisfies:s.satisfies?s.satisfies.split(/[,;]+/).map(function(x){
        return x.replace(/^\s+|\s+$/g,'');}).filter(Boolean):[],
      justification:s.justification,surrogate:!!s.surrogate});});});
  return out;
}
function exportJSON(){
  var compFilters={};
  S.comps.forEach(function(c){
    var f=state.flt[c.id];
    if(f&&Object.keys(f).length)compFilters[c.name]=f;});
  return JSON.stringify({model:S.name,generated:new Date().toISOString(),
    catalogue:'rocket_kb_full.json',
    constraints:{mission_cost_limit:state.mcost,mission_mass_limit:state.mmass,
      component_filters:compFilters},
    totals:totals(),
    selections:buildSelections()},null,2);
}
function buildList(){
  var by={},open=[];
  S.comps.forEach(function(c){
    var s=selsOf(c.id);
    if(!s.length){open.push(c.name);return;}
    s.forEach(function(x){(by[x.container||'Vessel 1']=by[x.container||'Vessel 1']||[])
      .push({part:x.part,role:c.name,cost:x.cost,mass:x.mass});});});
  var L=['# KSP build list: '+S.name,''];
  Object.keys(by).sort().forEach(function(v){
    L.push('## '+v,'');
    var tc=0,tm=0;
    by[v].forEach(function(e){
      if(typeof e.cost==='number')tc+=e.cost;
      if(typeof e.mass==='number')tm+=e.mass;
      L.push('- '+e.part+'  (role: '+e.role+
        (typeof e.cost==='number'?'; cost '+e.cost:'')+
        (typeof e.mass==='number'?'; mass '+e.mass+' t':'')+')');});
    L.push('','Subtotal: cost '+Math.round(tc)+', dry mass '+
      Math.round(tm*1000)/1000+' t','');});
  if(open.length)L.push('## Open roles (no part selected)','',
    open.map(function(o){return '- '+o;}).join('\n'),'');
  if(state.mcost!=null||state.mmass!=null){
    var t=totals();
    L.push('## Mission limits','');
    if(state.mcost!=null)L.push('- Cost: '+t.cost+' selected, limit '+state.mcost+
      (t.cost<=state.mcost?' (within limit)':' (OVER LIMIT)'));
    if(state.mmass!=null)L.push('- Dry mass: '+t.mass+' t selected, limit '+state.mmass+
      ' t'+(t.mass<=state.mmass?' (within limit)':' (OVER LIMIT)'));
    L.push('');
  }
  L.push('---','Note: this list covers the selected parts only. Fuel tanks sized to the '+
    'delta-v budget, decouplers between stages, and structural elements still need to be '+
    'added during assembly.');
  return L.join('\n');
}

function saveText(suggested,content,ext,desc,mime){
  if(window.showSaveFilePicker){
    var acc={};acc[mime||'text/plain']=[ext];
    return window.showSaveFilePicker({suggestedName:suggested,
        types:[{description:desc,accept:acc}]})
      .then(function(h){return h.createWritable();})
      .then(function(w){return w.write(content).then(function(){return w.close();});})
      .then(function(){return 'saved';})
      .catch(function(e){
        if(e&&e.name==='AbortError')return 'cancelled';
        return download(suggested,content);});
  }
  return Promise.resolve(download(suggested,content));
}
function download(name,content){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:'application/octet-stream'}));
  a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);
  return 'downloaded';
}

  'Architecture Blank diagram, where each part renders with its assigned role nested '+
  'inside.</p>'},
 {id:'privacy',title:'Data handling',html:
  '<p>The application is a single HTML file with the parts catalogue embedded. It makes '+
  'no network requests; models are read and written entirely within the browser. Work '+
  'in progress is kept in the browser’s local storage under the model’s name, so '+
  'closing the tab does not lose the selection.</p>'}];

function qh(id){return ' <button class="qh" data-h="'+id+'" title="Help">?</button>';}
function wireHelpButtons(){
  [].forEach.call(document.querySelectorAll('[data-h]'),function(b){
    b.onclick=function(e){e.stopPropagation();openHelp(b.getAttribute('data-h'));};});
}
function openHelp(id){
  var hp=document.getElementById('hpanel');
  var h='<button class="hclose" id="hx">Close</button><h2>Help</h2>'+
    '<p class="mut" style="font-size:12px;margin:0 0 2px">ARC-Twin · hardware selection '+
    'for Capella physical architectures</p>';
  HELP.forEach(function(s){h+='<h3 id="h-'+s.id+'">'+esc(s.title)+'</h3>'+s.html;});
  hp.innerHTML=h;
  var ov=document.getElementById('hov');
  ov.hidden=false;
  document.getElementById('hx').onclick=closeHelp;
  ov.onclick=function(e){if(e.target===ov)closeHelp();};
  if(id){var el=document.getElementById('h-'+id);if(el)el.scrollIntoView();}
  else hp.scrollTop=0;
}
function closeHelp(){document.getElementById('hov').hidden=true;}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeHelp();});
document.getElementById('bHelp').onclick=function(){openHelp(null);};

/* ------------------------------------------------------------------ *
 *  Dispatcher
 * ------------------------------------------------------------------ */

function render(){
  if(!S){renderLanding();return;}
  var tabs=document.getElementById('tabs');
  tabs.style.display='';
  document.getElementById('bAud').style.display=S.audit.length?'':'none';
  document.getElementById('bComp').style.display=S.comps.length?'':'none';
  document.getElementById('bMap').style.display=S.comps.length?'':'none';
  document.getElementById('bRec').style.display=S.comps.length?'':'none';
  ['bComp','bMap','bAud','bRec'].forEach(function(id){
    document.getElementById(id).classList.remove('on');});
  var cur={comp:'bComp',map:'bMap',audit:'bAud',rec:'bRec'}[state.view];
  if(cur)document.getElementById(cur).classList.add('on');
  document.getElementById('hm').textContent=S.name+' · '+
    (S.mode==='guide'?'no Physical Architecture yet':S.comps.length+' open role(s)')+
    (S.audit.length?' · '+S.audit.length+' hardware':'');
  renderSide();
  if(state.view==='guide')renderGuide();
  else if(state.view==='map')renderMap();
  else if(state.view==='audit')renderAudit();
  else if(state.view==='rec')renderRec();
  else renderComp();
}
document.getElementById('bComp').onclick=function(){state.view='comp';render();};
document.getElementById('bMap').onclick=function(){state.view='map';render();};
document.getElementById('bAud').onclick=function(){state.view='audit';render();};
document.getElementById('bRec').onclick=function(){state.view='rec';render();};
document.getElementById('bNew').onclick=function(){S=null;state=null;renderLanding();};

renderLanding();
</script>
